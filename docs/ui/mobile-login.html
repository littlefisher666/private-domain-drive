<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 私域网盘</title>
  <link rel="stylesheet" href="./css/prototype.css" />
</head>
<body>
  <div class="device-page">
    <div>
      <div class="device-toolbar">
        <div class="left"><a class="btn btn-secondary" href="./index.html">返回目录</a></div>
        <div class="right"><span class="label">Android · 登录闭环</span></div>
      </div>
      <div class="phone-shell">
        <div class="phone-screen android">
          <div class="status-bar"><span>09:41</span><span>5G ▮▮▮</span></div>
          <div class="login-wrap">
            <div class="brand">
              <div class="brand-badge">PD</div>
              <h1>登录</h1>
              <p>使用成员账号进入共享空间</p>
            </div>
            <div id="login-form">
              <div class="alert danger hidden" id="login-error"></div>
              <div class="field-group">
                <label class="field-label">成员账号</label>
                <input id="login-account" class="field" value="family.admin" />
              </div>
              <div class="field-group">
                <label class="field-label">访问口令</label>
                <input id="login-password" class="field" type="password" value="admin123" />
              </div>
              <button class="btn btn-primary btn-block" id="login-btn">登录</button>
              <p class="helper-text">演示账号：family.admin / admin123，family.member / member123</p>
              <div class="login-demo-actions">
                <button class="btn btn-secondary" id="demo-admin" type="button">管理员成功</button>
                <button class="btn btn-secondary" id="demo-member" type="button">成员成功</button>
                <button class="btn btn-secondary" id="demo-fail" type="button">模拟失败</button>
              </div>
            </div>
            <div id="login-loading" class="hidden">
              <div class="alert info">正在获取临时凭证…</div>
              <div class="progress-card">
                <div class="progress-head"><strong>会话初始化</strong><span>进行中</span></div>
                <div class="progress-track"><div class="progress-fill" style="width:62%"></div></div>
                <div class="progress-meta"><span>签发临时凭证</span><span>约 1 秒</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/prototype.js"></script>
</body>
</html>
