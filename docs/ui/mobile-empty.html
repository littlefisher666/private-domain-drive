<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空目录 · 私域网盘</title>
  <link rel="stylesheet" href="./css/prototype.css" />
</head>
<body>
  <div class="device-page">
    <div>
      <div class="device-toolbar">
        <div class="left"><a class="btn btn-secondary" href="./index.html">返回目录</a></div>
        <div class="right"><span class="label">Android · 空状态入口</span></div>
      </div>
      <div class="phone-shell">
        <div class="phone-screen android">
          <div class="status-bar"><span>09:41</span><span>5G ▮▮▮</span></div>
          <div class="app-header"><div><h1>共享空间</h1><p class="subtitle">family.admin · uploads</p></div><button class="icon-btn" type="button" aria-label="刷新">↻</button></div>
          <div class="path-bar"><span class="path-chip">shared / uploads</span></div>
          <div class="view-toolbar"><div class="view-mode-toggle"><button class="view-mode-btn active" type="button">列表</button><button class="view-mode-btn" type="button">缩略图</button></div></div>
          <div class="app-content stack">
            <div class="empty-state"><div class="emoji"></div><h3>当前目录为空</h3><p>可以新建文件夹或上传文件。</p><button class="btn btn-primary" id="go-empty">上传或新建</button></div>
            <a class="btn btn-secondary btn-block" href="./mobile-files.html">返回文件列表</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/prototype.js"></script>
  <script>
    document.getElementById('go-empty').addEventListener('click', () => {
      if (!AppStore.get().session.loggedIn) {
        AppStore.login('family.admin', 'admin123');
      }
      AppStore.ensureDir('shared/uploads/');
      AppStore.setPath('shared/uploads/');
      location.href = './mobile-files.html';
    });
  </script>
</body>
</html>
